<!doctype html><html lang="en"><head><meta charset="utf-8"><title>DELTA Emails</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#FAF9F5;--surface:#fff;--fg:#141413;--fg2:#5E5D59;--border:#E0DDD2;--accent:#2D6FA3;--inset:#F0EEE6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1420;--surface:#171D2C;--fg:#EEF0F5;--fg2:#A9B1C7;--border:#2B3348;--accent:#7FB2DE;--inset:#1E2538}}
:root[data-theme="dark"]{--bg:#0F1420;--surface:#171D2C;--fg:#EEF0F5;--fg2:#A9B1C7;--border:#2B3348;--accent:#7FB2DE;--inset:#1E2538}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0 0 4px}p{color:var(--fg2);margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
button{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer}
button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.sp{flex:1}.meta{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:12px}
.meta b{color:var(--fg2);font-weight:500;margin-right:8px}
.frame{display:flex;justify-content:center;background:var(--inset);border:1px solid var(--border);border-radius:8px;padding:16px;overflow-x:auto}
iframe{border:0;background:#fff;width:100%;height:560px;transition:width .15s}
</style></head><body><div class="wrap">
<h1>DELTA emails</h1><p>One shared layout. Placeholders in the code are filled with sample values here.</p>
<div class="bar" id="tabs" role="group" aria-label="Emails"></div>
<div class="bar"><button id="d" aria-pressed="true">Desktop</button><button id="m" aria-pressed="false">Phone</button></div>
<div class="meta"><b>Subject</b><span id="subj"></span></div>
<div class="frame"><iframe id="f" title="Email preview"></iframe></div>
</div>
<script>
